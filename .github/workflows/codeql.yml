name: CodeQL

# public リポジトリでは無料。private リポジトリでは GitHub Code Security（有料）が必要なため、
# private の間は解析をスキップし、public に切り替えると自動で動き始める。
# schedule イベントには github.event.repository が含まれないため、API でリポジトリの公開状態を確認する。
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  visibility:
    runs-on: ubuntu-latest
    outputs:
      private: ${{ steps.check.outputs.private }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "private=$(gh api "repos/${{ github.repository }}" --jq .private)" >> "$GITHUB_OUTPUT"

  analyze:
    needs: visibility
    if: needs.visibility.outputs.private == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: github/codeql-action/init@v4
        with:
          languages: go
          build-mode: autobuild
      - uses: github/codeql-action/analyze@v4
