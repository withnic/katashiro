name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: lint (golangci-lint, version pinned in Makefile)
        run: make lint
      - run: go test -race ./...
      - name: genmaster seed mode works offline
        run: go run -tags katashiro_genmaster ./cmd/genmaster -out "$RUNNER_TEMP/master"
      - name: third-party notices can be generated (every linked module has a license file)
        run: go run ./tools/notices > "$RUNNER_TEMP/THIRD_PARTY_NOTICES"

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: build (CGO disabled)
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -trimpath -ldflags="-w -s" -o /dev/null ./cmd/katashiro

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: govulncheck (version pinned in Makefile)
        run: make vuln

  docker:
    # ランナー標準の docker（BuildKit）でビルドする。追加の Action を使わないので SHA 固定の対象も増えない。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: build image (runs go test inside)
        run: docker build -t katashiro:ci .
      - name: smoke test (CLI)
        run: |
          docker run --rm katashiro:ci version
          docker run --rm katashiro:ci export 3 --with-kyc --format=jsonl | tee /dev/stderr | test "$(wc -l)" -eq 3
      - name: smoke test (HTTP API)
        run: |
          docker run -d --name katashiro -p 8080:8080 katashiro:ci
          for i in $(seq 1 20); do curl -fsS http://localhost:8080/healthz && break; sleep 1; done
          curl -fsS -X POST "http://localhost:8080/api/v1/personas/next?count=2" | python3 -c 'import json,sys; assert len(json.load(sys.stdin)) == 2'
          docker rm -f katashiro
      - name: license files are bundled
        run: |
          id=$(docker create katashiro:ci)
          docker cp "$id:/usr/share/doc/katashiro/LICENSE" ./LICENSE.image
          docker cp "$id:/usr/share/doc/katashiro/THIRD_PARTY_NOTICES" ./NOTICES.image
          docker rm "$id"
          grep -q "MIT License" LICENSE.image
          grep -q "modernc.org/sqlite" NOTICES.image
