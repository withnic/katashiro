version: 2

before:
  hooks:
    - go mod tidy
    # 依存ライブラリのライセンス文（MIT / BSD はバイナリ配布時に同梱が必要）
    - sh -c 'go run ./tools/notices > THIRD_PARTY_NOTICES'

builds:
  - id: katashiro
    main: ./cmd/katashiro
    binary: katashiro
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE
      - THIRD_PARTY_NOTICES

checksum:
  name_template: checksums.txt

# 前回のタグからの変更をコミットの件名で分類する（件名の書き方: Add … / Fix … / Docs: … / Build(deps): …）
changelog:
  use: github
  sort: asc
  format: "{{ .Message }} ({{ slice .SHA 0 7 }})"
  groups:
    - title: 新機能
      regexp: '^(Add|Feat)\b'
      order: 0
    - title: 修正
      regexp: '^Fix\b'
      order: 1
    - title: 依存関係の更新
      regexp: '^Build\(deps\)'
      order: 2
    - title: その他
      order: 999
  filters:
    # 利用者に関係しない変更はリリースノートに載せない
    exclude:
      - '^Docs:'
      - '^Test:'
      - '^CI:'
      - '^Chore:'
      - '^Merge '
